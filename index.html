<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Пожелание</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Georgia', serif;
      /* Фон с горами Кавказа */
      background-image: url('https://images.unsplash.com/photo-1544735716-392fe2489ffa?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      text-align: center;
      padding: 20px;
    }
    .card {
      max-width: 500px;
      background: rgba(0, 0, 0, 0.65); /* Затемнение, чтобы текст читался на фоне гор */
      border-radius: 12px;
      padding: 40px 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      color: #ffffff;
    }
    h1 {
      font-size: 2rem;
      color: #e0c070;
      margin-bottom: 20px;
    }
    p {
      font-size: 1.2rem;
      line-height: 1.6;
      color: #eeeeee;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>С днём рождения!</h1>
    <p>Желаем тебе счастья, здоровья и всего самого наилучшего.</p>
    <p style="margin-top: 30px; font-style: italic;">
  </div>
</body>
</html>
