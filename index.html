<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Поздравление</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Georgia', serif;
      background-color: #1a1a1a;
      color: #f0f0f0;
      text-align: center;
      padding: 20px;
    }
    .card {
      max-width: 500px;
      background: #242424;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 40px 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    h1 {
      font-size: 2rem;
      color: #e0c070;
      margin-bottom: 20px;
    }
    p {
      font-size: 1.2rem;
      line-height: 1.6;
      color: #cccccc;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>С днём рождения, папа!</h1>
    <p>Желаю тебе счастья, здоровья и всего самого наилучшего.</p>
    <p style="margin-top: 30px; font-style: italic;">
  </div>
</body>
</html>
